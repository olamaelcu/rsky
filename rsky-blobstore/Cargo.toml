[package]
name = "rsky-blobstore"
version = "0.1.0"
edition = "2021"
publish = true
description = "Storage abstraction for atproto PDS blobs."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
bytes = "1"
data-encoding = { version = "2", optional = true }
futures = "0.3"
thiserror = "1"
lexicon_cid = { workspace = true }
opendal = { version = "0.53", features = ["services-fs", "services-s3"], optional = true }
rand = { workspace = true, optional = true }
tokio = { version = "1", features = ["fs"], optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
disk = ["dep:tokio", "dep:tokio-util", "dep:rand", "dep:data-encoding", "dep:tracing"]
opendal = ["dep:opendal", "dep:rand"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "fs"] }
sha2 = { workspace = true }
tempfile = "3"